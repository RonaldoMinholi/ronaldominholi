name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  gerar:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: RonaldoMinholi
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publicar animação
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
